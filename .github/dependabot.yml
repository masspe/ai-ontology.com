# Weekly dependency PRs for every ecosystem in the repository, including the
# GitHub Actions the CI itself runs (pinned to commit SHAs in ci.yml, so an
# update is a reviewed PR, never a silent tag move).
#
# 2026-09-28: version-update PRs DISABLED (open-pull-requests-limit: 0) at the
# owner's request — the first run flooded the mailbox. Security alerts stay on
# (repository setting). Raise the limits to re-enable.
#
# Updates are grouped: one PR per ecosystem and week (minor + patch), and a
# separate PR per major bump, which always needs a human look. Without the
# groups the first run opened 19 PRs at once (2026-09-25).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      web-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /auth-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      auth-server-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
