name: CI

on:
  push:
    # Feature branches run the full matrix on push so a stacked branch is
    # verified before its PR exists.
    branches: [main, 'feat/**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  guard:
    # Refuses the file shapes of the 2026-09-24 injection (fake fonts,
    # VS Code folderOpen tasks, obfuscated sources, npm hooks); see
    # scripts/repo_guard.py and docs/INCIDENT-2026-09-25.md.
    name: repo guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/repo_guard.py --self-test
      - run: python3 scripts/repo_guard.py

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    # The storage layer touches the filesystem directly (fsync, truncation,
    # later mmap) and its behaviour differs between platforms; development
    # happens on Windows and deployment on Linux, so both must stay green.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  web:
    # The React UI has its own unit tests (vitest) and must type-check and
    # build with the strict tsconfig.
    name: web (vitest, tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # With coverage: vitest.config.ts enforces the 90 % thresholds.
      - run: npm run test:coverage
      - run: npx tsc --noEmit
      - run: npx vite build

  coverage:
    # Line coverage of the Rust workspace (cargo-llvm-cov, whole suite
    # including the end-to-end tests that spawn the binary) and of the web
    # UI (vitest, V8). scripts/coverage_badges.py turns both reports into
    # shields.io endpoint documents, force-pushed to the orphan branch
    # `coverage-badges`; the README badges read them from there, so they
    # always show the last measurement on main. Runs only on main: it
    # recompiles everything instrumented, which is slow.
    name: coverage (badges)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          key: llvm-cov
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust coverage (cargo llvm-cov)
        # cargo-llvm-cov does not create the parent directory of --output-path.
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --workspace --locked --json --output-path target/llvm-cov/cov.json
      - name: Web coverage (vitest, V8)
        working-directory: web
        run: |
          npm ci
          npx vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=text-summary
      - name: Badges and table (fails below 90 % on any crate or the web)
        run: python3 scripts/coverage_badges.py --rust target/llvm-cov/cov.json --web web/coverage/coverage-summary.json --out badges --fail-under 90
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-badges
          path: badges
      - name: Publish badges on the coverage-badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd badges
          git init -q -b coverage-badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "coverage badges for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" coverage-badges
