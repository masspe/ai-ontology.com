name: CI

on:
  push:
    # Feature branches run the full matrix on push so a stacked branch is
    # verified before its PR exists.
    branches: [main, 'feat/**', 'sec/**']
  pull_request:

# The workflow token is read-only; the coverage job alone asks for
# contents: write to publish the badges branch.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  guard:
    # Refuses file shapes that hide executable code in a repository (fake
    # fonts, VS Code folderOpen tasks, obfuscated sources, npm lifecycle
    # hooks); see scripts/repo_guard.py.
    name: repo guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/repo_guard.py --self-test
      - run: python3 scripts/repo_guard.py

  fmt:
    name: rustfmt
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    # The storage layer touches the filesystem directly (fsync, truncation,
    # later mmap) and its behaviour differs between platforms; development
    # happens on Windows and deployment on Linux, so both must stay green.
    name: test (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked

  web:
    # The React UI has its own unit tests (vitest) and must type-check and
    # build with the strict tsconfig.
    name: web (vitest, tsc, build)
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # With coverage: vitest.config.ts enforces the 90 % thresholds.
      - run: npm run test:coverage
      - run: npx tsc --noEmit
      - run: npx vite build

  audit:
    # Known vulnerabilities in the Rust and npm dependency trees.
    name: audit (cargo, npm)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-audit
      - run: cargo audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: auth-server

  deny:
    # Licences, advisories, sources and duplicate versions of the Rust
    # dependency tree, against `deny.toml`.
    name: deny (cargo-deny)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-deny
      - run: cargo deny check

  connectors:
    # The database connectors against real engines: a PostgreSQL and a
    # SQL Server that live for this job, seeded from
    # crates/io/tests/fixtures/live, read through each driver (the ODBC one
    # through the PostgreSQL ODBC driver), then a source synced into the
    # graph and asked through the server. No other job builds the
    # connector features. Each engine is its own step, and a failure is
    # repeated as an annotation (scripts/ci-annotate.sh).
    name: connectors (PostgreSQL, SQL Server, ODBC)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FEATURES: ontology-server/sqlserver,ontology-server/odbc,ontology-server/postgres
      ONTOLOGY_TEST_ENGINES: required
      # Not a secret: the password of engines that exist for this job only.
      ENGINE_PASSWORD: Throwaway-ci-0nly
      ONTOLOGY_TEST_POSTGRES: host=127.0.0.1 port=5432 database=postgres user=postgres password=Throwaway-ci-0nly
      ONTOLOGY_TEST_SQLSERVER: host=127.0.0.1 port=1433 database=master user=sa password=Throwaway-ci-0nly
      ONTOLOGY_TEST_ODBC: Driver={PostgreSQL Unicode};Server=127.0.0.1;Port=5432;Database=postgres;Uid=postgres;Pwd=Throwaway-ci-0nly;
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: connectors
      - name: start the engines
        run: |
          # PostgreSQL with TLS on, under the self-signed certificate its image ships.
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD="$ENGINE_PASSWORD" postgres:17             -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          docker run -d --name mssql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$ENGINE_PASSWORD"             mcr.microsoft.com/mssql/server:2022-latest
      - name: the ODBC driver manager and the PostgreSQL driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc-dev odbc-postgresql
      - name: clippy with every connector
        run: cargo clippy --workspace --all-targets --locked --features "$FEATURES" -- -D warnings
      - name: build the tests
        run: cargo test --locked -p ontology-io -p ontology-server --features "$FEATURES" --no-run
      - name: seed PostgreSQL
        run: |
          for _ in $(seq 1 60); do docker exec pg pg_isready -q -h 127.0.0.1 -U postgres && break; sleep 2; done
          docker exec -i -e PGPASSWORD="$ENGINE_PASSWORD" pg psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres < crates/io/tests/fixtures/live/postgres.sql
      - name: seed SQL Server
        run: |
          sqlcmd() { docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -b -S 127.0.0.1 -U sa -P "$ENGINE_PASSWORD" "$@"; }
          for _ in $(seq 1 60); do sqlcmd -Q "select 1" >/dev/null 2>&1 && break; sleep 2; done
          docker cp crates/io/tests/fixtures/live/sqlserver.sql mssql:/tmp/seed.sql
          sqlcmd -d master -i /tmp/seed.sql
      - name: PostgreSQL
        run: bash scripts/ci-annotate.sh cargo test --locked -p ontology-io --features "$FEATURES" --test live_engines postgres_
      - name: SQL Server
        if: ${{ !cancelled() }}
        run: bash scripts/ci-annotate.sh cargo test --locked -p ontology-io --features "$FEATURES" --test live_engines sql_server_
      - name: ODBC
        if: ${{ !cancelled() }}
        run: bash scripts/ci-annotate.sh cargo test --locked -p ontology-io --features "$FEATURES" --test live_engines an_odbc_
      - name: a source synced and asked through the server
        if: ${{ !cancelled() }}
        run: bash scripts/ci-annotate.sh cargo test --locked -p ontology-server --features "$FEATURES" --test sources a_real_engine_
      - name: the io and server suites with every connector built
        if: ${{ !cancelled() }}
        run: bash scripts/ci-annotate.sh cargo test --locked -p ontology-io -p ontology-server --features "$FEATURES"

  auth-server:
    # The Node auth server has its own tests;
    # they run after the guard, never before.
    name: auth-server (node --test)
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth-server/package-lock.json
      - run: npm ci
      - run: npm test

  image:
    # The deliverable: build the container image, then run
    # scripts/e2e_image.sh against it — seed, sign-up, login, API and UI on
    # one port, clean stop, restart with the data and the account intact.
    name: image (build, e2e)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: ontology:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash scripts/e2e_image.sh ontology:e2e

  upgrade:
    # A store written by the previous `main` must open with the
    # commit under test — same graph, writable, compactable, restorable
    # (scripts/upgrade_check.sh). The previous version is built from its
    # own checkout; on main it is the parent commit, elsewhere the merge
    # base with origin/main.
    name: upgrade (previous main -> current)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: build the current version
        run: cargo build --locked --bin ontology
      - name: build the previous version
        run: |
          # On main: the tip before this push (HEAD~1 if the event has none); elsewhere the merge base.
          before="${{ github.event.before }}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ -n "$before" ] && ! echo "$before" | grep -qx "0*" && git cat-file -e "$before" 2>/dev/null; then prev=$before; else prev=$(git rev-parse HEAD~1); fi
          else prev=$(git merge-base HEAD origin/main); fi
          echo "previous: $(git log --oneline -1 "$prev")"
          git worktree add --detach ../previous "$prev"
          # Built as it was green under its own CI: no -D warnings from a newer stable.
          (cd ../previous && RUSTFLAGS= CARGO_TARGET_DIR="$PWD/target" cargo build --locked --bin ontology)
          cp ../previous/target/debug/ontology /tmp/ontology-previous
      - run: bash scripts/upgrade_check.sh /tmp/ontology-previous target/debug/ontology

  coverage:
    # Line coverage of the Rust workspace (cargo-llvm-cov, whole suite
    # including the end-to-end tests that spawn the binary) and of the web
    # UI (vitest, V8). scripts/coverage_badges.py turns both reports into
    # shields.io endpoint documents, force-pushed to the orphan branch
    # `coverage-badges`; the README badges read them from there, so they
    # always show the last measurement on main. Runs only on main: it
    # recompiles everything instrumented, which is slow.
    name: coverage (badges)
    needs: guard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: llvm-cov
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust coverage (cargo llvm-cov)
        # cargo-llvm-cov does not create the parent directory of --output-path.
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --workspace --locked --json --output-path target/llvm-cov/cov.json
      - name: Web coverage (vitest, V8)
        working-directory: web
        run: |
          npm ci
          npx vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=text-summary
      - name: Badges and table (fails below 90 % on any crate or the web)
        run: python3 scripts/coverage_badges.py --rust target/llvm-cov/cov.json --web web/coverage/coverage-summary.json --out badges --fail-under 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-badges
          path: badges
      - name: Publish badges on the coverage-badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd badges
          git init -q -b coverage-badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "coverage badges for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" coverage-badges
